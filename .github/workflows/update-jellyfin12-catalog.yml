name: Update SSO Jellyfin catalog for 4.2.0.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-jellyfin12-catalog.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sso-catalog-v4.2.0.0
  cancel-in-progress: false

jobs:
  publish-catalog:
    if: github.repository == 'nbenedek/jellyfin-plugin-sso'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Download and validate public stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _catalog
          gh release download v4.2.0.0 --repo nbenedek/jellyfin-plugin-sso --pattern sso-authentication_4.2.0.0.zip --dir _catalog
          gh release download v4.2.0.0 --repo nbenedek/jellyfin-plugin-sso --pattern SHA256SUMS --dir _catalog
          ( cd _catalog && sha256sum -c SHA256SUMS )
          python3 tools/verify_release_package.py _catalog/sso-authentication_4.2.0.0.zip 4.2.0.0
          gh release view v4.2.0.0 --repo nbenedek/jellyfin-plugin-sso --json body --jq .body > _catalog/notes.md
      - name: Retrieve existing manifest with original 4.1.0.0 compatibility entry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/manifest-release:refs/remotes/origin/manifest-release
          git show origin/manifest-release:manifest.json > _catalog/previous.json
      - name: Generate exact checksum-based dual-version catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, pathlib, zipfile
          d=pathlib.Path('_catalog')
          archive=d/'sso-authentication_4.2.0.0.zip'
          with zipfile.ZipFile(archive) as f:
              meta=json.loads(f.read('meta.json'))
          assert meta['guid']=='505ce9d1-d916-42fa-86ca-673ef241d7df'
          assert meta['targetAbi']=='12.0.0.0'
          assert meta['version']=='4.2.0.0'
          old=json.loads((d/'previous.json').read_text())
          assert isinstance(old,list) and len(old)==1
          entry=old[0]
          assert entry['guid']==meta['guid']
          assert entry['name']=='SSO Authentication'
          assert len(entry['versions'])==1 and entry['versions'][0]['version']=='4.1.0.0'
          assert entry['versions'][0]['targetAbi']=='10.11.0.0'
          url='https://github.com/nbenedek/jellyfin-plugin-sso/releases/download/v4.2.0.0/sso-authentication_4.2.0.0.zip'
          ver={
              'changelog':(d/'notes.md').read_text(),
              'checksum':hashlib.md5(archive.read_bytes()).hexdigest(),
              'sourceUrl':url,
              'targetAbi':'12.0.0.0',
              'timestamp':'2026-11-13T11:16:11Z',
              'version':'4.2.0.0'
          }
          assert ver['changelog'].strip()
          entry['versions'].insert(0,ver)
          entry['description']=meta['description']
          entry['overview']='OIDC-only authentication for Jellyfin 12.x and 10.11.x; select the compatible version.'
          (d/'manifest.json').write_text(json.dumps(old,indent=2,ensure_ascii=False)+'\n')
          print('New version checksum (MD5, required by Jellyfin catalog):',ver['checksum'])
          print('Versions:',[(v['version'],v['targetAbi']) for v in entry['versions']])
          PY
      - name: Commit and push manifest-release only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --detach origin/manifest-release
          cp _catalog/manifest.json manifest.json
          git add manifest.json
          if git diff --cached --quiet; then
            echo 'Catalog already up to date'
            exit 0
          fi
          git commit -m 'catalog: publish SSO 4.2.0.0 for Jellyfin 12 and retain 4.1.0.0'
          git push origin HEAD:refs/heads/manifest-release
      - name: Verify repository catalog contains both compatible releases
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/manifest-release:refs/remotes/origin/manifest-release
          git show origin/manifest-release:manifest.json > _catalog/verified.json
          python3 - <<'PY'
          import json
          expected=json.load(open('_catalog/manifest.json'))
          actual=json.load(open('_catalog/verified.json'))
          assert expected==actual
          assert [(v['version'],v['targetAbi']) for v in actual[0]['versions']]==[('4.2.0.0','12.0.0.0'),('4.1.0.0','10.11.0.0')]
          print('PASS: version 4.2.0.0 first, 4.1.0.0 retained, checksum published')
          PY
